name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DisplaySwitcher.sln

      - name: Build
        run: dotnet build DisplaySwitcher.sln -c Release --no-restore -warnaserror

      - name: Pack portable ZIP
        shell: pwsh
        run: ./scripts/publish.ps1 -Version 0.0.0-ci

      - uses: actions/upload-artifact@v7
        with:
          name: DisplaySwitcher-portable
          path: dist/*.zip
          retention-days: 14
