name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            '${{ github.event.inputs.version }}'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $version"

      - name: Build and pack
        shell: pwsh
        run: ./scripts/publish.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
          name: v${{ steps.version.outputs.version }}
          body: |
            Unzip somewhere permanent, run **DisplaySwitcher.exe** to build your display profiles,
            then run **Setup.exe** to wire it into Sunshine.

            Both executables are self-contained, so there is no .NET runtime to install.
